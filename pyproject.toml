[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-relay"
version = "0.2.0"
description = "Minimal Transformers-compatible recurrent memory via delayed Right-attention updates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=5.14.1,<6"]

[project.optional-dependencies]
test = ["pytest>=8"]
flash = ["flash-attn>=2.6.0,<3"]
tracking = ["wandb>=0.18"]

[tool.setuptools]
packages = ["trace_relay"]

[tool.setuptools.package-dir]
trace_relay = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cuda: requires a CUDA GPU and the actual flash-attn package"]
