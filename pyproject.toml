[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-relay"
version = "0.3.0"
description = "Minimal Transformers-compatible recurrent memory via immediate causal write/read attention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=5.14.1,<6"]

[project.optional-dependencies]
test = ["pytest>=8"]
flash = ["flash-attn>=2.6.0,<3"]
tracking = ["wandb>=0.18"]
babylm = ["numpy>=1.26", "huggingface-hub>=0.30"]
most-freq = ["matplotlib>=3.8"]
dyck = ["matplotlib>=3.8"]
reset-most-freq = ["matplotlib>=3.8"]
entity-tracking = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["trace_relay", "trace_relay.modular_addition"]

[tool.setuptools.package-dir]
trace_relay = "."

[tool.setuptools.package-data]
"trace_relay.modular_addition" = ["*.sh", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cuda: requires a CUDA GPU and the actual flash-attn package"]
